name: Daily Media Release Checker

on:
  schedule:
    - cron: '0 8 * * *'  # Runs daily at 08:00 AM UTC
  workflow_dispatch:      # Allows manual trigger via GitHub Web UI
    inputs:
      send_test:
        description: 'Send a test notification to verify ntfy configuration'
        required: false
        type: boolean
        default: true

jobs:
  check-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Release Checker
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEND_TEST: ${{ inputs.send_test }}
        run: python python/checker.py || true

      - name: Trigger Live Production Endpoint
        run: |
          curl -s "https://media-tracker-daw5.onrender.com/api/cron/check" || true
